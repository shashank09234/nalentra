version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nalentra-postgres
    environment:
      POSTGRES_DB: nalentra_dev
      POSTGRES_USER: nalentra_dev_user
      POSTGRES_PASSWORD: dev_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d
    networks:
      - nalentra-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nalentra_dev_user -d nalentra_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nalentra-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nalentra-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: nalentra-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - nalentra-net
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: nalentra-minio
    environment:
      MINIO_ROOT_USER: minio_root_user
      MINIO_ROOT_PASSWORD: minio_root_password
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - nalentra-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../../nalentra-backend
      dockerfile: deployment/Dockerfile
    container_name: nalentra-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nalentra_dev
      SPRING_DATASOURCE_USERNAME: nalentra_dev_user
      SPRING_DATASOURCE_PASSWORD: dev_secure_password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      MINIO_ENDPOINT: http://minio:9000
    networks:
      - nalentra-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../../../nalentra-frontend
      dockerfile: Dockerfile
    container_name: nalentra-frontend
    networks:
      - nalentra-net
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    build:
      context: ../nginx
    container_name: nalentra-nginx
    ports:
      - "80:80"
    networks:
      - nalentra-net
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:

networks:
  nalentra-net:
    name: nalentra-net
    driver: bridge
